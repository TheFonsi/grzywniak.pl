name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Check PHP contact endpoint syntax
        run: php -l api/contact.php

      - name: Upload production bundle
        uses: actions/upload-artifact@v5
        with:
          name: production-site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to SFTP
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_SERVER_DIR: ${{ secrets.SFTP_SERVER_DIR }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download production bundle
        uses: actions/download-artifact@v5
        with:
          name: production-site
          path: dist

      - name: Deploy website bundle
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ env.SFTP_SERVER }}
          username: ${{ env.SFTP_USERNAME }}
          password: ${{ env.SFTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: ./dist/*
          remote_path: ${{ env.SFTP_SERVER_DIR }}

      - name: Deploy PHP contact endpoint
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ env.SFTP_SERVER }}
          username: ${{ env.SFTP_USERNAME }}
          password: ${{ env.SFTP_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: ./api/contact.php
          remote_path: ${{ env.SFTP_SERVER_DIR }}api/
