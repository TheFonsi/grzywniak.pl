name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build

      - name: Check PHP contact endpoint syntax
        run: php -l api/contact.php

      - name: Upload production bundle
        uses: actions/upload-artifact@v7
        with:
          name: production-site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy over SSH
    needs: quality
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_DOMAIN: grzywniak.pl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download production bundle
        uses: actions/download-artifact@v7
        with:
          name: production-site
          path: dist

      - name: Configure SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          ssh-keygen -lf ~/.ssh/id_ed25519.pub
          ssh-keyscan -H -p 22 "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Set deployment paths
        run: |
          echo "DEPLOY_PATH=/usr/home/$DEPLOY_USER/domains/$DEPLOY_DOMAIN/public_nodejs/public/" >> "$GITHUB_ENV"
          echo "API_DEPLOY_PATH=/usr/home/$DEPLOY_USER/domains/api.$DEPLOY_DOMAIN/public_html/" >> "$GITHUB_ENV"

      - name: Deploy website bundle
        run: |
          set -euo pipefail
          rsync -az --delete --exclude 'api/' ./dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: Deploy contact endpoint
        run: |
          set -euo pipefail
          rsync -az --delete ./api/ "$DEPLOY_USER@$DEPLOY_HOST:${API_DEPLOY_PATH}"

      - name: Restart website process
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "devil www restart $DEPLOY_DOMAIN"
